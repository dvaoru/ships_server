<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ships — Админка Лидерборда</title>
  <style>
    :root {
      --bg: #121820;
      --card: #1b2430;
      --text: #e1e7ec;
      --text-muted: #8b9bb4;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --border: #2a3749;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 22px; color: #fff; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .auth-bar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
    input, select, button { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: #0f151c; color: #fff; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    button { background: var(--accent); cursor: pointer; border: none; font-weight: 500; transition: opacity 0.2s; color: #fff; }
    button:hover { opacity: 0.9; }
    button.btn-danger { background: var(--danger); }
    button.btn-rename { background: #6366f1; }
    button.btn-secondary { background: #374151; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
    .tab-btn { background: #1e293b; color: var(--text-muted); }
    .tab-btn.active { background: var(--accent); color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
    tr:hover { background: rgba(255,255,255,0.02); }
    .player-id { font-family: monospace; font-size: 11px; color: var(--text-muted); }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; background: #263345; }
    .actions { display: flex; gap: 6px; }
    .status-msg { margin-top: 10px; font-size: 13px; }
    .status-ok { color: var(--success); }
    .status-err { color: var(--danger); }
    @media (max-width: 600px) {
      .hide-mobile { display: none; }
      th, td { padding: 8px 6px; font-size: 13px; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>⚓ Ships — Управление лидебордом</h1>
    <div id="auth-status" class="badge">Не авторизован</div>
  </header>

  <div class="card">
    <div class="auth-bar">
      <input type="password" id="admin-pass" placeholder="Пароль администратора..." style="flex:1;">
      <button onclick="savePassword()">Войти</button>
      <button class="btn-secondary" onclick="logout()">Сброс</button>
    </div>
    <div id="auth-hint" style="font-size:12px; color:var(--text-muted);">Пароль сохраняется локально в браузере.</div>
  </div>

  <div class="card" id="content-card" style="display:none;">
    <div class="tabs">
      <button class="tab-btn active" id="tab-gold" onclick="switchTab('gold')">Золото (gold)</button>
      <button class="tab-btn" id="tab-kills" onclick="switchTab('kills')">Убийства (kills)</button>
      <button class="btn-secondary" style="margin-left:auto;" onclick="loadData()">↻ Обновить</button>
    </div>

    <div class="toolbar">
      <input type="search" id="search-input" placeholder="Поиск по нику..." style="flex:1; min-width:160px;">
      <button class="btn-secondary" id="prev-btn" onclick="prevPage()">‹ Назад</button>
      <span id="page-info" style="color:var(--text-muted); font-size:13px; white-space:nowrap;">Стр. 1</span>
      <button class="btn-secondary" id="next-btn" onclick="nextPage()">Вперёд ›</button>
    </div>

    <div id="status" class="status-msg"></div>

    <div style="overflow-x:auto;">
      <table id="table">
        <thead>
          <tr>
            <th style="width:40px;">#</th>
            <th>Имя</th>
            <th>Очки</th>
            <th class="hide-mobile">Player ID</th>
            <th class="hide-mobile">Дата</th>
            <th style="width:140px;">Действия</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="6" style="text-align:center; color:var(--text-muted);">Загрузка...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let currentBoard = "gold";
  let adminPassword = localStorage.getItem("ships_admin_key") || "";

  // ─── Пагинация и поиск ──────────────────────────────────────────────────
  const PAGE_SIZE = 100;
  let offset = 0;
  let total = 0;
  let searchTerm = "";

  // Вычисляем базовый путь API от текущего URL страницы
  const basePath = window.location.pathname.split("/admin/leaderboard")[0];
  const apiBase = (basePath ? basePath : "") + "/api/admin/leaderboard";

  if (adminPassword) {
    document.getElementById("admin-pass").value = adminPassword;
    checkAuth();
  }

  // Поддержка нажатия клавиши Enter в поле ввода пароля
  document.getElementById("admin-pass").addEventListener("keydown", function(e) {
    if (e.key === "Enter") savePassword();
  });

  // Поиск по нику с дебаунсом, чтобы не дёргать сервер на каждый символ
  let searchDebounce = null;
  document.getElementById("search-input").addEventListener("input", function(e) {
    searchTerm = e.target.value.trim();
    if (searchDebounce) clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function() { offset = 0; loadData(); }, 300);
  });

  // Единый конструктор query-строки для всех запросов к админскому API
  function buildQuery() {
    return "?boardKey=" + encodeURIComponent(currentBoard) +
           "&limit=" + PAGE_SIZE +
           "&offset=" + offset +
           "&search=" + encodeURIComponent(searchTerm) +
           "&adminKey=" + encodeURIComponent(adminPassword);
  }

  function savePassword() {
    adminPassword = document.getElementById("admin-pass").value.trim();
    if (!adminPassword) {
      alert("Введите пароль");
      return;
    }
    localStorage.setItem("ships_admin_key", adminPassword);
    checkAuth();
  }

  function logout() {
    localStorage.removeItem("ships_admin_key");
    adminPassword = "";
    document.getElementById("admin-pass").value = "";
    document.getElementById("content-card").style.display = "none";
    document.getElementById("auth-status").textContent = "Не авторизован";
    document.getElementById("auth-status").style.color = "var(--danger)";
    setStatus("");
  }

  async function checkAuth() {
    try {
      const res = await fetch(apiBase + buildQuery(), {
        headers: { "x-admin-key": adminPassword }
      });
      if (res.ok) {
        document.getElementById("auth-status").textContent = "Авторизован ✓";
        document.getElementById("auth-status").style.color = "var(--success)";
        document.getElementById("content-card").style.display = "block";
        loadData();
      } else {
        const err = await res.json().catch(() => ({}));
        document.getElementById("auth-status").textContent = err.error || "Неверный пароль";
        document.getElementById("auth-status").style.color = "var(--danger)";
        document.getElementById("content-card").style.display = "none";
      }
    } catch (e) {
      document.getElementById("auth-status").textContent = "Ошибка связи: " + e.message;
      document.getElementById("auth-status").style.color = "var(--danger)";
      document.getElementById("content-card").style.display = "none";
    }
  }

  function switchTab(board) {
    currentBoard = board;
    offset = 0;
    document.getElementById("tab-gold").classList.toggle("active", board === "gold");
    document.getElementById("tab-kills").classList.toggle("active", board === "kills");
    loadData();
  }

  function prevPage() {
    if (offset <= 0) return;
    offset = Math.max(offset - PAGE_SIZE, 0);
    loadData();
  }

  function nextPage() {
    if (offset + PAGE_SIZE >= total) return;
    offset += PAGE_SIZE;
    loadData();
  }

  function updatePager() {
    const pages = Math.max(Math.ceil(total / PAGE_SIZE), 1);
    const page  = Math.floor(offset / PAGE_SIZE) + 1;
    const from  = total === 0 ? 0 : offset + 1;
    const to    = Math.min(offset + PAGE_SIZE, total);

    document.getElementById("page-info").textContent =
      "Стр. " + page + " из " + pages + " · " + from + "–" + to + " (всего " + total + ")";
    document.getElementById("prev-btn").disabled = offset <= 0;
    document.getElementById("next-btn").disabled = offset + PAGE_SIZE >= total;
  }

  async function loadData() {
    const tbody = document.getElementById("table-body");

    // Заглушка «загрузка» без перерисовки всей таблицы
    tbody.replaceChildren();
    const loadingRow = document.createElement("tr");
    const loadingCell = document.createElement("td");
    loadingCell.colSpan = 6;
    loadingCell.style.textAlign = "center";
    loadingCell.style.color = "var(--text-muted)";
    loadingCell.textContent = "Загрузка данных...";
    loadingRow.appendChild(loadingCell);
    tbody.appendChild(loadingRow);
    setStatus("");

    try {
      const res = await fetch(apiBase + buildQuery(), {
        headers: { "x-admin-key": adminPassword }
      });
      const data = await res.json();

      if (!res.ok) {
        setStatus(data.error || "Ошибка загрузки", true);
        return;
      }

      total = data.total || 0;
      updatePager();

      tbody.replaceChildren();

      if (!data.entries || data.entries.length === 0) {
        const emptyRow = document.createElement("tr");
        const emptyCell = document.createElement("td");
        emptyCell.colSpan = 6;
        emptyCell.style.textAlign = "center";
        emptyCell.style.color = "var(--text-muted)";
        emptyCell.textContent = searchTerm ? "Ничего не найдено" : "Таблица лидеров пуста";
        emptyRow.appendChild(emptyCell);
        tbody.appendChild(emptyRow);
        return;
      }

      // Строки собираем во фрагмент: одна вставка в DOM вместо конкатенации HTML
      const fragment = document.createDocumentFragment();
      for (const entry of data.entries) {
        fragment.appendChild(buildRow(entry));
      }
      tbody.appendChild(fragment);

    } catch (err) {
      setStatus("Ошибка сети: " + err.message, true);
    }
  }

  // Собирает одну строку таблицы через DOM API (без innerHTML и inline-обработчиков —
  // так данные игрока не могут внедрить разметку/скрипт)
  function buildRow(entry) {
    const tr = document.createElement("tr");

    const rankCell = document.createElement("td");
    const rankStrong = document.createElement("strong");
    rankStrong.textContent = entry.rank;
    rankCell.appendChild(rankStrong);
    tr.appendChild(rankCell);

    const nameCell = document.createElement("td");
    nameCell.textContent = entry.name;
    tr.appendChild(nameCell);

    const scoreCell = document.createElement("td");
    const scoreBadge = document.createElement("span");
    scoreBadge.className = "badge";
    scoreBadge.style.color = "#fbbf24";
    scoreBadge.style.fontWeight = "bold";
    scoreBadge.textContent = entry.score;
    scoreCell.appendChild(scoreBadge);
    tr.appendChild(scoreCell);

    const idCell = document.createElement("td");
    idCell.className = "hide-mobile";
    const idSpan = document.createElement("span");
    idSpan.className = "player-id";
    idSpan.textContent = entry.playerId;
    idCell.appendChild(idSpan);
    tr.appendChild(idCell);

    const dateCell = document.createElement("td");
    dateCell.className = "hide-mobile";
    dateCell.style.color = "var(--text-muted)";
    dateCell.style.fontSize = "12px";
    dateCell.textContent = new Date(entry.updatedAt * 1000).toLocaleString("ru-RU");
    tr.appendChild(dateCell);

    const actionsCell = document.createElement("td");
    const actions = document.createElement("div");
    actions.className = "actions";

    const renameBtn = document.createElement("button");
    renameBtn.className = "btn-rename";
    renameBtn.textContent = "Имя";
    renameBtn.addEventListener("click", function() { renamePlayer(entry.playerId, entry.name); });

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "btn-danger";
    deleteBtn.textContent = "Удалить";
    deleteBtn.addEventListener("click", function() { deletePlayer(entry.playerId, entry.name); });

    actions.appendChild(renameBtn);
    actions.appendChild(deleteBtn);
    actionsCell.appendChild(actions);
    tr.appendChild(actionsCell);

    return tr;
  }

  async function deletePlayer(playerId, name) {
    if (!confirm('Удалить игрока "' + name + '" (' + playerId + ') из доски ' + currentBoard + '?')) return;

    try {
      const res = await fetch(apiBase + "/delete?adminKey=" + encodeURIComponent(adminPassword), {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-key": adminPassword },
        body: JSON.stringify({ boardKey: currentBoard, playerId: playerId })
      });
      const data = await res.json();
      if (res.ok && data.deleted) {
        setStatus('Запись игрока "' + name + '" удалена', false);
        loadData();
      } else {
        setStatus(data.error || "Не удалось удалить", true);
      }
    } catch (err) {
      setStatus("Ошибка: " + err.message, true);
    }
  }

  async function renamePlayer(playerId, oldName) {
    const newName = prompt('Новое имя для игрока "' + oldName + '":', "Капитан");
    if (!newName || newName === oldName) return;

    try {
      const res = await fetch(apiBase + "/rename?adminKey=" + encodeURIComponent(adminPassword), {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-key": adminPassword },
        body: JSON.stringify({ boardKey: currentBoard, playerId: playerId, newName: newName })
      });
      const data = await res.json();
      if (res.ok && data.renamed) {
        setStatus('Имя игрока успешно изменено', false);
        loadData();
      } else {
        setStatus(data.error || "Не удалось изменить имя", true);
      }
    } catch (err) {
      setStatus("Ошибка: " + err.message, true);
    }
  }

  function setStatus(msg, isError) {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className = "status-msg " + (isError ? "status-err" : "status-ok");
  }
</script>
</body>
</html>
